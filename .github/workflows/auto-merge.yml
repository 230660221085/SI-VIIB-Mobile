name: Auto-merge student PR

on:
  pull_request_target:
    types: [labeled]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  guard-and-merge:
    if: github.event.label.name == 'auto-merge'
    runs-on: ubuntu-latest
    steps:
      - name: Safety check lalu merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          FAIL_MSG=""
          fail() { FAIL_MSG="${FAIL_MSG}
          - $1"; }

          if [ "$BASE_REF" != "main" ]; then
            fail "base branch harus main, bukan $BASE_REF"
          fi

          MERGEABLE=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .mergeable)
          if [ "$MERGEABLE" = "false" ]; then
            fail "ada merge conflict dengan main"
          fi

          ALLOWED=""
          if [[ "$AUTHOR" =~ ^[0-9]{11,12}$ ]]; then
            ALLOWED="$AUTHOR"
          else
            echo "WARNING: login $AUTHOR bukan NIM, aturan folder sendiri tidak aktif"
          fi

          FILES=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
            --jq '.[] | [.status, .filename, (.previous_filename // "")] | @tsv')

          TOTAL_FILES=$(grep -cve '^\s*$' <<<"$FILES" || true)
          if [ "$TOTAL_FILES" -gt 200 ]; then
            fail "PR terlalu besar ($TOTAL_FILES file), batas auto-merge 200 file"
          fi

          while IFS=$'\t' read -r status filename prev; do
            [ -z "${status:-}" ] && continue

            if [ "$status" = "removed" ]; then
              fail "menghapus file: $filename"
            fi

            case "$filename" in
              README.md|.gitignore|.github/*)
                fail "menyentuh file terlindungi repo: $filename"
                ;;
            esac

            for p in "$filename" ${prev:+"$prev"}; do
              topdir=$(printf '%s' "$p" | cut -d/ -f1)
              topnims=$(grep -oE '2306[0-9]{8,}' <<<"$topdir" | sort -u || true)
              for nim in $topnims; do
                if [ -n "$ALLOWED" ] && [ "$nim" != "$ALLOWED" ]; then
                  fail "menyentuh folder mahasiswa lain ($nim): $p"
                fi
              done
            done
          done <<<"$FILES"

          if [ -n "$FAIL_MSG" ]; then
            echo "Safety check GAGAL:"
            echo "$FAIL_MSG"
            gh pr comment "$PR_NUMBER" --repo "$REPO" \
              --body "❌ Auto-merge ditolak, minta review manual:$FAIL_MSG"
            exit 1
          fi

          echo "Safety check lolos. Merge PR #$PR_NUMBER..."
          gh pr merge "$PR_NUMBER" --repo "$REPO" --merge --delete-branch=false
          echo "PR #$PR_NUMBER merged."
